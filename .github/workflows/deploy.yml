name: deploy

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: smarttrack2project
  REGION: asia-southeast1
  REPOSITORY: fastapi-repo
  SERVICE_NAME: fastapi-postgres-demo

permissions:
  id-token: write       # REQUIRED (ให้ github-actions/auth ใช้ OIDC Token)
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 0) Checkout source code
      # ------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 1) Authenticate to Google Cloud using OIDC
      # ------------------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/1064347068142/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-deploy@smarttrack2project.iam.gserviceaccount.com"


      # ------------------------------------------------------------
      # 2) Setup gcloud CLI
      # ------------------------------------------------------------
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2


      # ------------------------------------------------------------
      # 3) Configure Docker for Artifact Registry
      # ------------------------------------------------------------
      - name: Configure docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet


      # ------------------------------------------------------------
      # 4) Build & Push Docker Image
      # ------------------------------------------------------------
      - name: Build & Push Docker Image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE_NAME}:${GITHUB_SHA}"

          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

          docker build -t $IMAGE .
          docker push $IMAGE


      # ------------------------------------------------------------
      # 5) Deploy to Cloud Run
      # ------------------------------------------------------------
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --timeout=300
