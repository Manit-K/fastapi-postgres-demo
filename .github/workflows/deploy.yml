name: deploy

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest

    env:
      PROJECT_ID: smarttrack2project
      REGION: asia-southeast1
      REPO: fastapi-repo
      IMAGE: asia-southeast1-docker.pkg.dev/smarttrack2project/fastapi-repo/fastapi-postgres-demo:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/729893918995/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@smarttrack2project.iam.gserviceaccount.com

      - name: Configure docker auth for Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-southeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build & Push Docker Image
        run: |
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: fastapi-postgres-demo
          image: ${{ env.IMAGE }}
          region: ${{ env.REGION }}
