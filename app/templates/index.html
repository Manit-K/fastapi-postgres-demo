<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>User Demo</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        input { padding: 8px; width: 250px; }
        button { padding: 8px 12px; margin-left: 8px; }
        table { width: 400px; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>

<h2>User List</h2>

<input type="text" id="nameInput" placeholder="Enter name">
<button onclick="addUser()">Add User</button>

<table>
    <thead>
        <tr><th>ID</th><th>Name</th></tr>
    </thead>
    <tbody id="userTable"></tbody>
</table>

<script>
    const API = "http://127.0.0.1:8000";

    async function loadUsers() {
        const res = await fetch(API + "/users");
        const users = await res.json();

        document.getElementById("userTable").innerHTML = users.map(u => `
            <tr><td>${u.id}</td><td>${u.name}</td></tr>
        `).join('');
    }

    async function addUser() {
        const name = document.getElementById("nameInput").value;
        if (!name) return alert("Please enter name!");

        await fetch(API + "/users?name=" + encodeURIComponent(name), {
            method: "POST"
        });

        document.getElementById("nameInput").value = "";
        loadUsers();
    }

    loadUsers();
</script>

</body>
</html>
