name: deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write     # ❗ ต้องมีเพื่อใช้ Workload Identity Federation

    runs-on: ubuntu-latest

    steps:
      # 1) Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Authenticate GitHub → Google Cloud (WIF)
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/729893918995/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-deploy@smarttrack2project.iam.gserviceaccount.com"
          token_format: "access_token"

      # 3) Configure Docker to use Artifact Registry
      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      # 4) Build & Push Docker Image
      - name: Build & Push Docker Image
        env:
          IMAGE: "asia-southeast1-docker.pkg.dev/smarttrack2project/fastapi-repo/fastapi-postgres-demo"
        run: |
          docker build -t $IMAGE .
          docker push $IMAGE

      # 5) Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy fastapi-postgres-demo \
            --image=asia-southeast1-docker.pkg.dev/smarttrack2project/fastapi-repo/fastapi-postgres-demo \
            --region=asia-southeast1 \
            --platform=managed \
            --allow-unauthenticated \
            --quiet
