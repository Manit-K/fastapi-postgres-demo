name: deploy

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: smarttrack2project
  REGION: asia-southeast1
  REPOSITORY: fastapi-repo
  SERVICE_NAME: fastapi-postgres-demo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      ###############################################################
      # 1) Authenticate to Google Cloud using Service Account (OIDC)
      ###############################################################
      - name: Google auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: "projects/10385314100175/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-deploy@smarttrack2project.iam.gserviceaccount.com"

      ################################################################
      # 2) Configure Docker for Artifact Registry
      ################################################################
      - name: Configure Artifact Registry Docker Auth
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      ################################################################
      # 3) Build + Push Docker Image
      ################################################################
      - name: Build & Push Docker Image
        run: |
          IMAGE="asia-southeast1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$SERVICE_NAME:${GITHUB_SHA}"
          echo "Building Image: $IMAGE"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> $GITHUB_ENV

      ################################################################
      # 4) Deploy to Cloud Run
      ################################################################
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --timeout=300
